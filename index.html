<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f2328">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Drammen · Vaktija</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">VAKTIJA</div>
      <h1>Drammen</h1>
      <div id="date" class="date">Učitavanje…</div>
    </header>

    <section id="notice" class="notice hidden"></section>
    <section id="prayers" class="prayer-grid"></section>

    <section class="next-card">
      <div>
        <div class="next-label">Sljedeće</div>
        <div id="nextPrayer" class="next-prayer">—</div>
      </div>
      <div id="countdown" class="countdown">—</div>
    </section>

    <footer>
      <span>Vrijeme prema dostavljenoj vaktiji</span>
      <span id="clock"></span>
    </footer>
  </main>

<script src="app.js"></script>
</body>
</html>
